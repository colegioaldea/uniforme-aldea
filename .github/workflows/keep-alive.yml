name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *'   # every day at 12:00 UTC
  workflow_dispatch:

env:
  TABLE: ventas   # table in the uniformes aldea project

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          if [ "$TABLE" = "your_table_name" ]; then
            echo "::error::Set TABLE at the top of this workflow to one of your tables."
            exit 1
          fi

          status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/${TABLE}?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || status="000"

          if [ "$status" = "200" ]; then
            echo "✅ uniformes aldea is alive (HTTP $status)"
          else
            echo "::error::Ping failed (HTTP $status)"
            cat /tmp/resp.json 2>/dev/null || true
            exit 1
          fi

      - name: Update keep-alive timestamp
        if: always()
        run: |
          echo "Last ping: $(date -u)" > ping-log.txt

      - name: Commit to keep repo active
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ping-log.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive $(date -u +%Y-%m-%d)"
          git push
