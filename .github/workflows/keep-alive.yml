name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *'   # todos los días a las 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase (write)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y SUPABASE_ANON_KEY."
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            status=$(curl -sS --max-time 20 -o /tmp/resp.json -w "%{http_code}" \
              -X PATCH "${SUPABASE_URL%/}/rest/v1/keepalive?id=eq.1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              -d "{\"last_ping\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}") || status="000"
            echo "Intento $attempt: HTTP $status"
            echo "Respuesta: $(cat /tmp/resp.json 2>/dev/null)"
            if [ "$status" = "200" ] && grep -q '"id"' /tmp/resp.json; then
              echo "✅ uniformes aldea está activo (fila actualizada)"
              exit 0
            fi
            sleep 20
          done

          echo "::error::Ping falló después de 5 intentos (HTTP $status)"
          exit 1

      - name: Update keep-alive timestamp
        if: always()
        run: |
          echo "Last ping: $(date -u)" > ping-log.txt

      - name: Commit to keep repo active
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ping-log.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive $(date -u +%Y-%m-%d)"
          git push
